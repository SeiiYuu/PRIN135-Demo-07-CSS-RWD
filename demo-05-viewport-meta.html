<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Viewport meta tag: tells mobile browsers to use the real device width
         instead of pretending to be a ~980px-wide desktop screen.
         Try deleting this line and opening the page on a phone (or DevTools
         device mode) to see the difference. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: Viewport Meta Tag</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .container {
            padding: 16px;
        }

        .box {
            background-color: lightblue;
            border: 2px solid #333;
            padding: 16px;
            font-size: 1.2rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Viewport Meta Tag Demo</h1>
        <div class="box">
            <p>
                The viewport meta tag is used to control the 
                layout and scaling of the page on different devices.
                Resize the browser window to see how the content
                adjusts to different screen sizes.
            </p>
        </div>
    </div>
    <div class="navigation">
        <a href="index.html">Back to Home</a>
    </div>
</body>

</html>
