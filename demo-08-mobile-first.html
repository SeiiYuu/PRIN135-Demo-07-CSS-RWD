<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: Mobile First</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* MOBILE FIRST: base styles are for small screens (one column).
           Larger screens add layout with min-width queries. */
        .container {
            display: grid;
            min-height: 100vh;
            grid-template-columns: 1fr;
            grid-template-areas:
                "header"
                "nav"
                "main"
                "sidebar"
                "ads"
                "footer";
        }

        .header  { grid-area: header;  background-color: lightcoral; }
        .nav     { grid-area: nav;     background-color: lightblue; }
        .main    { grid-area: main;    background-color: lightyellow; min-height: 200px; }
        .sidebar { grid-area: sidebar; background-color: lightgreen; }
        .ads     { grid-area: ads;     background-color: orange; }
        .footer  { grid-area: footer;  background-color: plum; }

        .header, .nav, .main, .sidebar, .ads, .footer {
            padding: 16px;
        }

        /* Tablet: screen >= 641px. Main and sidebar sit side by side */
        @media (min-width: 641px) {
            .container {
                grid-template-columns: 2fr 1fr;
                grid-template-areas:
                    "header  header"
                    "nav     nav"
                    "main    sidebar"
                    "ads     ads"
                    "footer  footer";
            }
        }

        /* Desktop: screen >= 1025px. Nav moves to the left, ads to the right */
        @media (min-width: 1025px) {
            .container {
                grid-template-columns: 200px 1fr 200px;
                grid-template-areas:
                    "header header  header"
                    "nav    main    sidebar"
                    "nav    main    ads"
                    "footer footer  footer";
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">header</div>
        <div class="nav">nav</div>
        <div class="main">main</div>
        <div class="sidebar">sidebar</div>
        <div class="ads">ads</div>
        <div class="footer">footer</div>
    </div>

</body>

</html>
