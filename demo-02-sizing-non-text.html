<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: Non-Text Relative Sizing</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            box-sizing: border-box;
        }

        .main {
            background-color: lightpink;
            margin: 0 auto;
            /* Relative width: 80% of the window, but never wider than 1000px */
            width: 80%;
            max-width: 1000px;
            min-width: 300px;
            height: 300px;
            padding: 20px;
        }

        .subsection {
            background-color: lightblue;
            /* 50% of the parent (.main), not of the window */
            width: 50%;
            height: 50%;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="subsection"></div>
    </div>
    <div class="navigation">
        <a href="index.html">Back to Home</a>
    </div>
</body>

</html>
