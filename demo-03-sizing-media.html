<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: Scaling Media</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            box-sizing: border-box;
        }

        .container-fixed {
            width: 50%;
            height: 200px;
            border: 5px dashed black;
            margin-bottom: 20px;
        }

        .container-responsive {
            width: 50%;
            height: 200px;
            border: 5px dashed black;
            margin-bottom: 20px;
        }

        /* Not responsive: the image keeps its original 720px width
           and overflows the container */
        .container-fixed img {
            width: 720px;
            height: 450px;
        }

        /* Responsive: the image never grows bigger than its container
           and keeps its aspect ratio */
        .container-responsive img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <div class="container-responsive">
        <img src="images/sample.jpg" alt="Sunset over mountains">
    </div>

    <div class="container-fixed">
        <img src="images/sample.jpg" alt="Sunset over mountains">
    </div>
    <div class="navigation">
        <a href="index.html">Back to Home</a>
    </div>
</body>

</html>
