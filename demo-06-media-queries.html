<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: Media Queries</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Default styles for desktop. Screen size > 1024px */
        body {
            background-color: lightsalmon;
            color: white;
        }

        h1::after {
            content: " Screen size > 1024px";
        }

        /* Screen size <= 640px or orientation: portrait */
        @media screen and (max-width: 640px), (orientation: portrait) {
            body {
                background-color: lightgreen;
            }

            h1::after {
                content: " Screen size <= 640px or orientation: portrait";
            }
        }
        /* Tablet: screen between 641px and 1024px */
        @media screen and (min-width: 641px) and (max-width: 1024px) {
            body {
                background-color: lightskyblue;
            }

            h1::after {
                content: " Screen size 641px - 1024px";
            }
        }
    </style>
</head>

<body>
    <h1>Media Query: Desktop First.</h1>
    <div class="navigation">
        <a href="index.html">Back to Home</a>
    </div>
</body>

</html>
